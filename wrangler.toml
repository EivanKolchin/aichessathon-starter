# The Worker lives in ladder/. This config sits at the repository root because that is where
# Cloudflare's build runs `npx wrangler deploy` from; keeping one config avoids the two
# drifting apart. Locally, `npm run deploy` from ladder/ passes --config for you.
# See ladder/README.md for the one-time setup.
# Must match the Worker the Cloudflare build deploys to, or wrangler overrides it and warns.
name = "chess-lab"
main = "ladder/src/index.js"
compatibility_date = "2025-09-01"

# Leave true while you bootstrap with a bearer token. Turn it off once the Worker sits
# on a custom domain behind Cloudflare Access, so the Access header cannot be spoofed.
workers_dev = true

[assets]
directory = "./ladder/public"
# src/index.js falls through to env.ASSETS for everything that is not /api/, so the binding
# has to be declared; without it the Worker throws on the first page request.
binding = "ASSETS"

[vars]
# Trust Cf-Access-Authenticated-User-Email. Only turn this on once Access fronts every
# route that reaches this Worker; until then the header is attacker-controlled.
ACCESS_ENABLED = "false"
# Comma-separated allowlist. Empty means any identity Access lets through.
ALLOWED_EMAILS = ""
# No sign-in at all: anybody who has the address can queue experiments, play the engine and
# upload agents. Understand what that means before leaving it on. Queueing an experiment makes
# code run on whichever machine is offering itself as a runner, and an uploaded agent is Python
# that that machine will execute. Set this to "false" and deploy to close it again; the bearer
# token and the Access path both keep working either way.
PUBLIC = "true"
# Compressed upload cap. The Worker buffers the zip in memory, so keep well under 100 MB.
MAX_ZIP_BYTES = "30000000"
# Mirrors harness/rules.py MAX_UNZIPPED_BYTES.
MAX_UNZIPPED_BYTES = "50000000"

# Both of these have to exist in your account before a deploy will validate. Create them once:
#   npx wrangler d1 create chess-ladder      -> paste the printed database_id below
#   npx wrangler r2 bucket create chess-ladder-agents
# A deploy with the placeholder still in place fails with "binding DB of type d1 must have a
# valid `database_id` specified [code: 10021]".
[[d1_databases]]
binding = "DB"
database_name = "chess-ladder"
database_id = "ebe6ff30-ef35-4aba-9a76-253e17b384d5"

# Agent build storage. R2 has to be enabled on the account before this bucket can exist:
#   Cloudflare dashboard -> R2 -> Overview, then
#   npx wrangler r2 bucket create chess-ladder-agents
# Comment this back out and the Worker still deploys and the experiments arena still works;
# only /api/upload and the build downloads answer 503. The binding has to be named BUCKET —
# that is what src/index.js reads, not the name wrangler suggests when it creates the bucket.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "chess-ladder-agents"
